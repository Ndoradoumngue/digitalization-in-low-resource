# HTTPS_MODE=letsencrypt - certificate managed by certbot (nginx plugin).
# Processed by envsubst at container startup; only ${LETSENCRYPT_DOMAIN} is
# substituted - nginx variables ($host, $uri, etc.) are left intact.

server {
    listen 80;
    server_name ${LETSENCRYPT_DOMAIN};
    return 301 https://${LETSENCRYPT_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${LETSENCRYPT_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/privkey.pem;

    # Modern TLS - TLSv1.2 kept for older ministry browsers
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    client_max_body_size 55M;

    # Security headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    root  /usr/share/nginx/html;
    index index.html;

    # Public share links (GED Phase 5) - the only routes reachable without
    # signing in. The API rate-limits them per client IP (X-Forwarded-For).
    location /s/ {
        proxy_pass         http://api:8000/s/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Legacy benchmark images - never in a shared cache (the API marks them
    # private: a cached copy would be served without a session).
    location /images/ {
        proxy_pass             http://api:8000/images/;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     60s;
    }

    # Never cache the app shell: after a rebuild the browser must fetch the new
    # index.html to pick up the new hashed bundle (expires keeps the security
    # headers, unlike add_header in a location).
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
