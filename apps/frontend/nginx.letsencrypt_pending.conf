# HTTPS_MODE=letsencrypt - HTTP-only while waiting for the first certbot run.
# After issuing a certificate, restart the container and this file is replaced
# by nginx.letsencrypt.conf (HTTPS) automatically.
#
# Issue a certificate with:
#   docker compose exec frontend certbot --nginx \
#     -d ${LETSENCRYPT_DOMAIN} --email <email> --agree-tos --non-interactive

server {
    listen 80;
    server_name ${LETSENCRYPT_DOMAIN};

    client_max_body_size 55M;

    # Security headers (no HSTS - HTTP-only until certificate is issued)
    server_tokens off;
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    # Public share links (GED Phase 5) - the only routes reachable without
    # signing in. The API rate-limits them per client IP (X-Forwarded-For).
    location /s/ {
        proxy_pass         http://api:8000/s/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Legacy benchmark images - never in a shared cache (the API marks them
    # private: a cached copy would be served without a session).
    location /images/ {
        proxy_pass             http://api:8000/images/;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout     60s;
    }

    # Never cache the app shell: after a rebuild the browser must fetch the new
    # index.html to pick up the new hashed bundle (expires keeps the security
    # headers, unlike add_header in a location).
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
