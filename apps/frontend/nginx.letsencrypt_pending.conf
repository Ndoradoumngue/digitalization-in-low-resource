# HTTPS_MODE=letsencrypt — HTTP-only while waiting for the first certbot run.
# After issuing a certificate, restart the container and this file is replaced
# by nginx.letsencrypt.conf (HTTPS) automatically.
#
# Issue a certificate with:
#   docker compose exec frontend certbot --nginx \
#     -d ${LETSENCRYPT_DOMAIN} --email <email> --agree-tos --non-interactive

# Cache for document images — 10 MB key-zone, up to 1 GB on disk, evict after 24 h idle.
# Files are stored in a two-level hash directory under /var/cache/nginx so that any
# single directory never accumulates more than 256 entries.
proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=images:10m
                 max_size=1g
                 inactive=24h
                 use_temp_path=off;

server {
    listen 80;
    server_name ${LETSENCRYPT_DOMAIN};

    client_max_body_size 55M;

    # Security headers (no HSTS — HTTP-only until certificate is issued)
    server_tokens off;
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy image serving — cached at the Nginx layer for 24 h.
    # Cache misses hit FastAPI once; subsequent requests for the same image are
    # served directly from disk without touching the Python process.
    # X-Cache-Status: HIT / MISS / EXPIRED / STALE / BYPASS reported to the client.
    location /images/ {
        proxy_cache            images;
        proxy_cache_valid      200 24h;
        proxy_cache_use_stale  error timeout updating;
        add_header             X-Cache-Status $upstream_cache_status;
        proxy_pass             http://api:8000/images/;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout     60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
