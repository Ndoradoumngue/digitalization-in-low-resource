server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI container (Docker internal DNS: "api")
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Proxy image serving to the same FastAPI container
    location /images/ {
        proxy_pass         http://api:8000/images/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # React SPA — all other paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
