# SDAI Digitalisation - Docker Compose
#
# Services:
#   redis     - Redis 7            (internal; caches schema / types / review count)
#   db        - PostgreSQL 15      (port 5432 - exposed for local tooling)
#   ollama    - Ollama VLM server  (internal port 11434, exposed optionally)
#   api       - FastAPI backend    (internal port 8000, proxied via nginx)
#   sync      - local/cloud sync worker (same image as api, idle unless configured)
#   backup    - nightly restic backups off-site (SFTP) and to a NAS (see RESTORE.md)
#   frontend  - React + Nginx      (public ports 80 → redirect, 443 → HTTPS)
#
# Quick start:
#   cp .env.example .env                               # edit AUTH_SECRET_KEY at minimum
#   docker compose up --build
#   docker compose exec api python create_admin.py --email admin@example.com --tenant default   # asks the password
#
# HTTPS modes (set HTTPS_MODE in .env):
#   self_signed  - default; this installation's certificate is generated at the
#                  frontend's first start (volume frontend_ssl), CN = SELF_SIGNED_CN.
#   letsencrypt  - certbot with the nginx plugin; requires LETSENCRYPT_DOMAIN + email.
#                  See README § HTTPS for the one-time certbot command.
#
# Offline deployment (no internet on the target server):
#   Run ./setup.sh once on an internet-connected machine, then transfer the
#   whole directory and run ./install.sh on the offline server (it loads the
#   bundled images, then scripts/first-run.sh configures and starts the node).

# Container logs (docker compose logs) are capped per service - Docker's
# default keeps them forever, which fills the disk of a server left running.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sdai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port 5432 is NOT exposed to the host in production.
    # Use: docker compose exec db psql -U sdai sdai
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdai}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    volumes:
      # Persistent model storage - survives container restarts
      - ollama_data:/root/.ollama
      # Offline model archive produced by setup.sh (read-only at runtime)
      - ./models:/models:ro
    ports:
      # Host-only (curl http://localhost:11434) - the model server has no
      # authentication, so never publish it to the LAN; safe to remove.
      - "127.0.0.1:11434:11434"
    environment:
      # 1 concurrent VLM request at a time. Was 2 ("Stage 2 is single-worker
      # but allows slight overlap between the outgoing request and response
      # parsing") but on memory-constrained hosts (<16 GiB total for the
      # whole Docker Desktop VM, shared with Postgres/Redis/the API), two
      # concurrent qwen2.5vl:7b contexts pushed peak memory past what's
      # available and the OS OOM-killed the model process mid-generation
      # ("signal: killed" in `docker compose logs ollama`) - a 500 from
      # Ollama that no VLM_PAGE_TIMEOUT_SECONDS value fixes, since the
      # process dies outright rather than running out of time. Raise back
      # to 2 once the host has comfortable headroom above 16 GiB.
      OLLAMA_NUM_PARALLEL: 1
      # Keep only one model loaded; qwen2.5vl:7b fills most of GPU/RAM already.
      OLLAMA_MAX_LOADED_MODELS: 1
    restart: unless-stopped
    logging: *default-logging
    # Override the default entrypoint so we can run a shell script that
    # restores the offline bundle before starting the server.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        MEM_KB=$$(awk '/MemTotal/ {print $$2}' /proc/meminfo)
        MEM_GB=$$(( MEM_KB / 1024 / 1024 ))
        if [ "$$MEM_KB" -lt 12582912 ]; then
          echo "WARNING: Docker only has ~$${MEM_GB} GiB of memory available."
          echo "qwen2.5vl:7b needs significantly more RAM than its ~6 GB on-disk"
          echo "size (weights + KV cache + inference overhead), on top of"
          echo "Postgres/Redis/the API/nginx sharing the same Docker VM."
          echo "Below ~16 GiB, ingestion will likely crash with a 500 error from"
          echo "Ollama and 'signal: killed' in this log - that means the OS"
          echo "killed the model process for lack of memory, not a bug."
          echo "Fix: Docker Desktop > Settings > Resources > Memory, raise to"
          echo "16 GiB+, apply, and restart Docker Desktop."
        fi
        if [ -f /models/ollama-models.tar.gz ] && [ ! -d /root/.ollama/models/manifests ]; then
          echo "Restoring model from offline archive (first run only)..."
          tar xzf /models/ollama-models.tar.gz -C /root/.ollama
        fi
        /bin/ollama serve &
        OLLAMA_PID=$$!
        echo "Waiting for Ollama server to be ready..."
        until /bin/ollama list >/dev/null 2>&1; do sleep 2; done
        if /bin/ollama list | grep -q 'qwen2.5vl'; then
          echo "Model ready."
        else
          echo "Pulling qwen2.5vl:7b (requires internet)..."
          /bin/ollama pull qwen2.5vl:7b
        fi
        wait $$OLLAMA_PID
    healthcheck:
      test: [ "CMD", "/bin/ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # allow time for model extraction on first boot

  api:
    # Fixed image names: the offline bundle (setup.sh) saves them and
    # install.sh starts them, whatever the installation folder is called.
    image: sdai/api:${SDAI_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      # documents/ is read-write so Google Drive imports can land in anonymized_docs/
      - ./documents:/app/documents
      # Persistent volume for processed images and uploaded files
      - apidata:/data
      # The organisation's signing certificate (SIGNING_P12_PATH=/secrets/...),
      # read-only; ./secrets/ is git-ignored and outside the synced folders
      - ./secrets:/secrets:ro
    environment:
      # In Docker, nginx proxies /api/* internally so CORS is not required.
      - CORS_ORIGINS=
      # JWT auth - run create_admin.py after first boot to seed the first user
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - AUTH_SECURE_COOKIES=${AUTH_SECURE_COOKIES:-true}
      # Language of answers without a usable Accept-Language (share pages, e-mails)
      - DEFAULT_LOCALE=${DEFAULT_LANGUAGE:-en}
      # PostgreSQL (asyncpg driver)
      - DATABASE_URL=${DATABASE_URL}
      # Ollama - use the containerised service (override with host.docker.internal:11434
      # if you prefer to use a host-installed Ollama instead)
      - OLLAMA_HOST=http://ollama:11434
      # Directory for processed images and file uploads
      - DATA_DIR=/data
      - REDIS_URL=${REDIS_URL}
      # Server identity in a hybrid local + cloud deployment (see README, Document management)
      - NODE_ID=${NODE_ID:-local}
      - NODE_ROLE=${NODE_ROLE:-local}
      # Local/cloud sync - the API serves /api/sync to the peer node when a
      # token is set (see the sync service below and .env.example); the peer
      # URL and alert threshold feed the admin Synchronisation page.
      - SYNC_NODE_TOKEN=${SYNC_NODE_TOKEN:-}
      - SYNC_PEER_URL=${SYNC_PEER_URL:-}
      - SYNC_ALERT_HOURS=${SYNC_ALERT_HOURS:-6}
      # Share links, original downloads and selective exports (README, Document management)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - DOWNLOAD_WATERMARK_CONFIDENTIAL=${DOWNLOAD_WATERMARK_CONFIDENTIAL:-false}
      - EXPORT_MAX_DOCUMENTS=${EXPORT_MAX_DOCUMENTS:-500}
      - EXPORT_MAX_MB=${EXPORT_MAX_MB:-2048}
      - EXPORT_LINK_HOURS=${EXPORT_LINK_HOURS:-24}
      - EXPORT_CONCURRENCY=${EXPORT_CONCURRENCY:-2}
      # Lifecycle - trash purge, retention job, destroyed-file sweep (README, Document management)
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-30}
      - RETENTION_JOB_INTERVAL_HOURS=${RETENTION_JOB_INTERVAL_HOURS:-24}
      - TRASH_PURGE_BATCH=${TRASH_PURGE_BATCH:-500}
      - DESTROYED_FILES_SWEEP_SECONDS=${DESTROYED_FILES_SWEEP_SECONDS:-600}
      # Notifications and e-mail, check-out, electronic signature (README, Document management)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - EMAIL_DIGEST_HOUR=${EMAIL_DIGEST_HOUR:-7}
      - CHECKOUT_DEFAULT_HOURS=${CHECKOUT_DEFAULT_HOURS:-8}
      - CHECKOUT_MAX_HOURS=${CHECKOUT_MAX_HOURS:-72}
      - SIGNING_P12_PATH=${SIGNING_P12_PATH:-}
      - SIGNING_P12_PASSWORD=${SIGNING_P12_PASSWORD:-}
      - SIGNING_TRUST_ROOTS=${SIGNING_TRUST_ROOTS:-}
      - SIGNING_LOCATION=${SIGNING_LOCATION:-}
      # Optional - customize the VLM extraction schema for your document
      # corpus without a rebuild. See README.md "Customizing the extraction
      # schema" and .env.example for details.
      - VLM_PROMPT_FILE=${VLM_PROMPT_FILE:-}
      - VLM_LIST_FIELDS=${VLM_LIST_FIELDS:-}
      - VLM_PAGE_TIMEOUT_SECONDS=${VLM_PAGE_TIMEOUT_SECONDS:-}
      - VLM_NUM_CTX=${VLM_NUM_CTX:-}
      - VLM_NUM_PREDICT=${VLM_NUM_PREDICT:-}
      - SPLIT_PAGE_COLUMNS=${SPLIT_PAGE_COLUMNS:-}
      - SPLIT_FROM_PAGE=${SPLIT_FROM_PAGE:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Uncomment to reach the API directly at http://localhost:8000
    # ports:
    #   - "8000:8000"

  # Local/cloud sync worker (same image as the API). On the node with
  # SYNC_PEER_URL (the local one) it pushes local changes to the peer and
  # pulls the peer's every SYNC_INTERVAL_SECONDS; elsewhere it only does
  # housekeeping. Idle without SYNC_NODE_TOKEN.
  sync:
    image: sdai/api:${SDAI_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: [ "python", "-m", "sync.worker" ]
    volumes:
      # Same mounts and in-container paths as the API: files referenced by
      # synced rows are copied between nodes at these exact paths.
      - ./documents:/app/documents
      - apidata:/data
    environment:
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - DATA_DIR=/data
      - NODE_ID=${NODE_ID:-local}
      - NODE_ROLE=${NODE_ROLE:-local}
      - SYNC_NODE_TOKEN=${SYNC_NODE_TOKEN:-}
      - SYNC_PEER_URL=${SYNC_PEER_URL:-}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-30}
      - SYNC_MAX_KBPS=${SYNC_MAX_KBPS:-0}
      - SYNC_CHANGELOG_RETENTION_DAYS=${SYNC_CHANGELOG_RETENTION_DAYS:-30}
      - DEFAULT_LOCALE=${DEFAULT_LANGUAGE:-en}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  # Nightly off-site backups (restic: database dump + /data + documents/)
  # to BACKUP_SFTP_TARGET and optionally BACKUP_NAS_PATH - see RESTORE.md.
  # Records every run in sdai_backup_runs (admin Synchronisation page).
  #   docker compose run --rm backup now            one backup right away
  #   docker compose run --rm backup restore-test   restore drill
  backup:
    image: sdai/backup:${SDAI_IMAGE_TAG:-latest}
    build:
      context: ./scripts/backup
    volumes:
      - apidata:/data:ro
      - ./documents:/app/documents:ro
      # SSH key + known_hosts for the SFTP target (id_ed25519, known_hosts)
      - ./backup/ssh:/root/.ssh:ro
      - ${BACKUP_NAS_PATH:-./backup/nas}:/nas
    environment:
      - PGHOST=db
      - PGUSER=${POSTGRES_USER:-sdai}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-sdai}
      - NODE_ID=${NODE_ID:-local}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - BACKUP_SFTP_TARGET=${BACKUP_SFTP_TARGET:-}
      # The NAS repository is used only when BACKUP_NAS_PATH is set.
      - BACKUP_NAS_PATH=${BACKUP_NAS_PATH:-}
      - BACKUP_TIME=${BACKUP_TIME:-02:30}
      - TZ=${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: sdai/frontend:${SDAI_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Let's Encrypt certificates - persists across restarts and rebuilds.
      - letsencrypt_data:/etc/letsencrypt
      # This installation's self-signed certificate (generated at first start)
      - frontend_ssl:/etc/nginx/ssl
    environment:
      # HTTPS mode: self_signed (default) or letsencrypt
      - HTTPS_MODE=${HTTPS_MODE:-self_signed}
      # Name the self-signed certificate is issued for (default: container host name)
      - SELF_SIGNED_CN=${SELF_SIGNED_CN:-}
      # Host HTTPS port, for the http:// -> https:// redirect (self_signed)
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      # Interface language until each person picks one (en|fr; empty = browser)
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-}
      # Required only when HTTPS_MODE=letsencrypt
      - LETSENCRYPT_DOMAIN=${LETSENCRYPT_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  apidata:
  ollama_data:
  redis_data:
  letsencrypt_data:
  frontend_ssl:
