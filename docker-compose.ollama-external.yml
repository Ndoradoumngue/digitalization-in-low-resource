# SDAI Digitalisation - Ollama outside Docker (OLLAMA_MODE=host or remote).
#
#   host    Ollama installed on this machine - the fastest choice on a Mac
#           (Docker on macOS cannot use the Apple GPU) and an alternative to
#           the docker-nvidia / docker-amd modes on Linux.
#           OLLAMA_HOST=http://host.docker.internal:11434
#   remote  Ollama on another machine of the local network (a GPU workstation
#           serving a NAS or a GPU-less server). OLLAMA_HOST=http://<ip>:11434
#
# The ollama container is not started and the API no longer waits for it.
# Added to COMPOSE_FILE by scripts/first-run.sh - never edit docker-compose.yml
# for it. Ollama has no authentication: keep port 11434 on the internal
# network only (see the administrator guide).

services:
  ollama:
    profiles: [ "ollama-in-docker" ]

  api:
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:?OLLAMA_HOST must be set when Ollama runs outside Docker}
    # host.docker.internal also on Linux (Docker Desktop defines it already)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
